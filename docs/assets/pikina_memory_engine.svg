<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background-color: #07090e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGradMem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>

    <linearGradient id="ephemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="permGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="100%" stop-color="#11998e"/>
    </linearGradient>

    <linearGradient id="graphGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="shadowMem" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowMem" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="950" height="480" fill="url(#bgGradMem)"/>

  <!-- Title Banner -->
  <text x="475" y="42" fill="#f8fafc" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1">DUAL-TIER MEMORY &amp; KNOWLEDGE GRAPH ENGINE</text>
  <text x="475" y="63" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">Ephemeral Vectors &bull; Corroborated Permanent Promotion &bull; Semantic Context Assembly</text>

  <!-- Box 1: Ephemeral Vector Memory -->
  <g transform="translate(45, 95)">
    <rect x="0" y="0" width="260" height="330" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowMem)"/>
    <rect x="15" y="15" width="230" height="28" rx="5" fill="url(#ephemGrad)"/>
    <text x="130" y="33" fill="#07090e" font-size="11" font-weight="800" text-anchor="middle">1. EPHEMERAL VECTOR STORE</text>

    <text x="20" y="68" fill="#cbd5e1" font-size="11" font-weight="700">Short-Term Event Log</text>
    <text x="20" y="85" fill="#94a3b8" font-size="9">&bull; Clipboard copies (cap: 10k chars)</text>
    <text x="20" y="100" fill="#94a3b8" font-size="9">&bull; Workspace file modifications</text>
    <text x="20" y="115" fill="#94a3b8" font-size="9">&bull; Recent user queries &amp; command outputs</text>

    <!-- Embedding Model Info -->
    <rect x="15" y="135" width="230" height="45" rx="6" fill="#07090e" stroke="#1e293b"/>
    <text x="25" y="153" fill="#38bdf8" font-size="10" font-weight="700">Embedding: All-MiniLM-L6-v2</text>
    <text x="25" y="168" fill="#64748b" font-size="9">384-dim dense vector representation</text>

    <!-- Auto-decay Sweep Box -->
    <rect x="15" y="195" width="230" height="115" rx="6" fill="#07090e" stroke="#f59e0b" stroke-opacity="0.6"/>
    <text x="25" y="215" fill="#f59e0b" font-size="11" font-weight="700">Forgetting Engine</text>
    <text x="25" y="233" fill="#cbd5e1" font-size="9">Sweep Interval: Every 60 minutes</text>
    <text x="25" y="248" fill="#cbd5e1" font-size="9">Max TTL: 24 Hours auto-expiry</text>
    <text x="25" y="265" fill="#ef4444" font-size="9" font-weight="600">Uncorroborated vectors pruned</text>
    <text x="25" y="295" fill="#38ef7d" font-size="9" font-weight="700">Corroboration Threshold: ≥ 3 Hits</text>
  </g>

  <!-- Promotion Arrow Box 1 -> Box 2 -->
  <g transform="translate(315, 235)">
    <path d="M 0 0 L 35 0" stroke="#38ef7d" stroke-width="2.5" filter="url(#glowMem)"/>
    <path d="M 28 -5 L 38 0 L 28 5 Z" fill="#38ef7d"/>
    <text x="18" y="-10" fill="#38ef7d" font-size="9" font-weight="800" text-anchor="middle">PROMOTED</text>
  </g>

  <!-- Box 2: Permanent Vector Memory -->
  <g transform="translate(360, 95)">
    <rect x="0" y="0" width="260" height="330" rx="10" fill="#0f172a" stroke="#38ef7d" stroke-width="1.5" filter="url(#shadowMem)"/>
    <rect x="15" y="15" width="230" height="28" rx="5" fill="url(#permGrad)"/>
    <text x="130" y="33" fill="#07090e" font-size="11" font-weight="800" text-anchor="middle">2. PERMANENT VECTOR STORE</text>

    <text x="20" y="68" fill="#cbd5e1" font-size="11" font-weight="700">Long-Term Semantic Core</text>
    <text x="20" y="85" fill="#94a3b8" font-size="9">&bull; Explicit user declarations ("call me...")</text>
    <text x="20" y="100" fill="#94a3b8" font-size="9">&bull; Promoted high-frequency file paths</text>
    <text x="20" y="115" fill="#94a3b8" font-size="9">&bull; User preference profiles &amp; habits</text>

    <rect x="15" y="135" width="230" height="175" rx="6" fill="#07090e" stroke="#1e293b"/>
    <text x="25" y="155" fill="#38ef7d" font-size="10" font-weight="700">Semantic Recall Query</text>
    <text x="25" y="173" fill="#f1f5f9" font-size="10" font-family="monospace">"recall project brief"</text>

    <line x1="25" y1="183" x2="230" y2="183" stroke="#1e293b"/>
    <text x="25" y="200" fill="#64748b" font-size="9" font-weight="600">Cosine Similarity Score: 0.92</text>
    <text x="25" y="215" fill="#cbd5e1" font-size="9">Matched: docs/blueprint.md</text>
    <text x="25" y="230" fill="#cbd5e1" font-size="9">Source: Permanent Memory Store</text>

    <rect x="25" y="245" width="200" height="48" rx="4" fill="#1e293b" fill-opacity="0.6"/>
    <text x="35" y="263" fill="#38ef7d" font-size="9" font-weight="700">✓ Grounded Context Ready</text>
    <text x="35" y="278" fill="#94a3b8" font-size="8">Prevents hallucination during LLM fallback</text>
  </g>

  <!-- Connect Arrow Box 2 -> Box 3 -->
  <g transform="translate(630, 235)">
    <path d="M 0 0 L 35 0" stroke="#c084fc" stroke-width="2.5" filter="url(#glowMem)"/>
    <path d="M 28 -5 L 38 0 L 28 5 Z" fill="#c084fc"/>
  </g>

  <!-- Box 3: Knowledge Graph & Context Assembly -->
  <g transform="translate(675, 95)">
    <rect x="0" y="0" width="230" height="330" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" filter="url(#shadowMem)"/>
    <rect x="15" y="15" width="200" height="28" rx="5" fill="url(#graphGrad)"/>
    <text x="115" y="33" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">3. KNOWLEDGE GRAPH</text>

    <text x="20" y="68" fill="#cbd5e1" font-size="11" font-weight="700">NetworkX Graph Topology</text>

    <!-- Mini Graph Visual inside Box -->
    <g transform="translate(115, 140)">
      <line x1="-50" y1="-25" x2="0" y2="0" stroke="#c084fc" stroke-width="1.5"/>
      <line x1="50" y1="-25" x2="0" y2="0" stroke="#c084fc" stroke-width="1.5"/>
      <line x1="0" y1="35" x2="0" y2="0" stroke="#38ef7d" stroke-width="1.5"/>

      <circle cx="0" cy="0" r="16" fill="#07090e" stroke="#c084fc" stroke-width="2"/>
      <text x="0" y="3" fill="#c084fc" font-size="8" font-weight="800" text-anchor="middle">User</text>

      <circle cx="-50" cy="-25" r="12" fill="#07090e" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="-50" y="-22" fill="#94a3b8" font-size="7" text-anchor="middle">Files</text>

      <circle cx="50" cy="-25" r="12" fill="#07090e" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="50" y="-22" fill="#94a3b8" font-size="7" text-anchor="middle">Tasks</text>

      <circle cx="0" cy="35" r="12" fill="#07090e" stroke="#38ef7d" stroke-width="1.5"/>
      <text x="0" y="38" fill="#94a3b8" font-size="7" text-anchor="middle">Events</text>
    </g>

    <!-- Context Assembly Box -->
    <rect x="15" y="215" width="200" height="95" rx="6" fill="#07090e" stroke="#1e293b"/>
    <text x="25" y="235" fill="#c084fc" font-size="10" font-weight="700">Context Assembly</text>
    <text x="25" y="253" fill="#cbd5e1" font-size="9">Pulls structural &amp; semantic facts</text>
    <text x="25" y="268" fill="#38ef7d" font-size="9" font-weight="600">Budget: ~2,000 Tokens Max</text>
    <text x="25" y="285" fill="#94a3b8" font-size="8">Packs grounded prompt to Ollama</text>
  </g>

  <text x="475" y="455" fill="#64748b" font-size="10" font-weight="500" text-anchor="middle">Autonomous semantic decay &bull; Strict token budgeting &bull; Zero hallucinated action execution</text>
</svg>
