<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" style="background-color: #07090e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="glowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Desktop Wallpaper Overlay -->
  <rect width="1000" height="500" fill="#080c14"/>
  
  <!-- Subtle Abstract Geometric Curves on Desktop -->
  <path d="M -100 500 Q 300 100 1100 400" stroke="#00f2fe" stroke-opacity="0.08" stroke-width="2" fill="none"/>
  <path d="M -100 200 Q 500 600 1100 100" stroke="#38ef7d" stroke-opacity="0.05" stroke-width="2" fill="none"/>

  <!-- Centered Quick Panel Window -->
  <rect x="150" y="80" width="700" height="340" rx="14" fill="url(#panelGrad)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.7" filter="url(#panelShadow)"/>

  <!-- Panel Header Bar -->
  <rect x="150" y="80" width="700" height="45" rx="14" fill="#07090e" fill-opacity="0.8"/>
  <path d="M 150 125 L 850 125" stroke="#1e293b" stroke-width="1"/>

  <!-- Brand Title -->
  <text x="175" y="108" fill="#00f2fe" font-size="12" font-weight="800" letter-spacing="1.5">PIKINA QUICK PANEL</text>
  
  <!-- Shortcut Badge -->
  <rect x="340" y="94" width="95" height="22" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="387.5" y="109" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">ALT + SPACE</text>

  <!-- Win32 Telemetry Quick Status -->
  <text x="825" y="108" fill="#38ef7d" font-size="11" font-weight="700" text-anchor="end">RAM: 48% • CPU: 12%</text>
  <circle cx="710" cy="104" r="4" fill="#38ef7d" filter="url(#glowLight)"/>

  <!-- Main Command Search Input Box -->
  <g transform="translate(175, 145)">
    <rect x="0" y="0" width="650" height="50" rx="8" fill="#07090e" stroke="#00f2fe" stroke-width="1.5" filter="url(#glowLight)"/>
    <text x="20" y="31" fill="#00f2fe" font-size="18" font-weight="700">›_</text>
    <text x="50" y="30" fill="#f8fafc" font-size="14" font-weight="600">lock screen</text>
    <text x="135" y="30" fill="#00f2fe" font-size="14" font-weight="400">|</text>
    
    <rect x="545" y="10" width="95" height="30" rx="5" fill="#1e293b"/>
    <text x="592.5" y="29" fill="#64748b" font-size="10" font-weight="700" text-anchor="middle">TIER 1 MATCH</text>
  </g>

  <!-- Autocomplete Suggestions List -->
  <g transform="translate(175, 210)">
    <!-- Suggestion 1 (Selected) -->
    <rect x="0" y="0" width="650" height="42" rx="6" fill="#1e293b" fill-opacity="0.9" stroke="#00f2fe" stroke-opacity="0.4"/>
    <rect x="12" y="11" width="55" height="20" rx="4" fill="#ff0844" fill-opacity="0.2" stroke="#ff0844"/>
    <text x="39.5" y="25" fill="#ff758c" font-size="9" font-weight="800" text-anchor="middle">L1 PERM</text>
    <text x="80" y="25" fill="#f1f5f9" font-size="12" font-weight="600">lock screen</text>
    <text x="160" y="25" fill="#94a3b8" font-size="11" font-weight="400">— Win32 Workstation Lock (system.lock_screen)</text>
    <text x="635" y="25" fill="#00f2fe" font-size="11" font-weight="700" text-anchor="end">↵ Enter</text>

    <!-- Suggestion 2 -->
    <rect x="0" y="48" width="650" height="40" rx="6" fill="#0b101d" fill-opacity="0.5"/>
    <rect x="12" y="58" width="55" height="20" rx="4" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.3"/>
    <text x="39.5" y="72" fill="#00f2fe" font-size="9" font-weight="800" text-anchor="middle">L0 PERM</text>
    <text x="80" y="72" fill="#cbd5e1" font-size="12" font-weight="500">calculate (45 * 2) + 10</text>
    <text x="240" y="72" fill="#64748b" font-size="11" font-weight="400">— Evaluates math expression = 100</text>

    <!-- Suggestion 3 -->
    <rect x="0" y="94" width="650" height="40" rx="6" fill="#0b101d" fill-opacity="0.5"/>
    <rect x="12" y="104" width="55" height="20" rx="4" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.3"/>
    <text x="39.5" y="118" fill="#00f2fe" font-size="9" font-weight="800" text-anchor="middle">L0 PERM</text>
    <text x="80" y="118" fill="#cbd5e1" font-size="12" font-weight="500">find file *.pdf</text>
    <text x="180" y="118" fill="#64748b" font-size="11" font-weight="400">— Search local filesystem index</text>
  </g>

  <!-- Panel Footer Bar -->
  <g transform="translate(175, 380)">
    <text x="0" y="15" fill="#64748b" font-size="10" font-weight="500">Use <tspan fill="#cbd5e1">↑ ↓</tspan> to navigate • <tspan fill="#cbd5e1">Esc</tspan> to dismiss panel</text>
    <text x="650" y="15" fill="#64748b" font-size="10" font-weight="500" text-anchor="end">Pikina Personal Operating Layer</text>
  </g>
</svg>
