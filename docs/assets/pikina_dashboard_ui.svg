<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background-color: #07090e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e2de2"/>
      <stop offset="100%" stop-color="#4a00e0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Main Window Frame -->
  <rect x="30" y="25" width="1140" height="625" rx="12" fill="#0b101d" stroke="#1e293b" stroke-width="1.5" filter="url(#subtleShadow)"/>

  <!-- Title Bar -->
  <path d="M 30 37 Q 30 25 42 25 L 1158 25 Q 1170 25 1170 37 L 1170 65 L 30 65 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="55" cy="45" r="6" fill="#ff5f56"/>
  <circle cx="75" cy="45" r="6" fill="#ffbd2e"/>
  <circle cx="95" cy="45" r="6" fill="#27c93f"/>

  <!-- App Brand Badge -->
  <rect x="125" y="34" width="105" height="22" rx="4" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.4"/>
  <text x="177" y="49" fill="#00f2fe" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">PIKINA OS</text>
  <text x="242" y="49" fill="#64748b" font-size="11" font-weight="500">v0.1-phase1 (JARVIS HUD)</text>

  <!-- Title Bar Clock & Status -->
  <rect x="520" y="34" width="160" height="22" rx="11" fill="#07090e" stroke="#1e293b"/>
  <circle cx="535" cy="45" r="4" fill="#38ef7d" filter="url(#glow)"/>
  <text x="605" y="49" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">13:14:02 IST • ONLINE</text>

  <!-- Quick Profile Toggle -->
  <rect x="1030" y="34" width="125" height="22" rx="4" fill="#1e293b"/>
  <text x="1092" y="49" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle">PRODUCTIVITY</text>

  <!-- LEFT COLUMN: System Telemetry & Objectives -->
  <g transform="translate(50, 80)">
    <!-- Diagnostics Panel -->
    <rect x="0" y="0" width="310" height="260" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
    <text x="16" y="28" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">SYSTEM DIAGNOSTICS</text>
    <line x1="16" y1="38" x2="294" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- CPU Bar -->
    <text x="16" y="66" fill="#94a3b8" font-size="11" font-weight="600">CPU</text>
    <rect x="60" y="55" width="180" height="14" rx="3" fill="#1e293b"/>
    <rect x="60" y="55" width="45" height="14" rx="3" fill="url(#cyanGrad)"/>
    <text x="252" y="66" fill="#e2e8f0" font-size="11" font-weight="700">25%</text>

    <!-- RAM Bar -->
    <text x="16" y="101" fill="#94a3b8" font-size="11" font-weight="600">RAM</text>
    <rect x="60" y="90" width="180" height="14" rx="3" fill="#1e293b"/>
    <rect x="60" y="90" width="86" height="14" rx="3" fill="url(#purpleGrad)"/>
    <text x="252" y="101" fill="#e2e8f0" font-size="11" font-weight="700">48%</text>

    <!-- DISK Bar -->
    <text x="16" y="136" fill="#94a3b8" font-size="11" font-weight="600">DISK</text>
    <rect x="60" y="125" width="180" height="14" rx="3" fill="#1e293b"/>
    <rect x="60" y="125" width="112" height="14" rx="3" fill="url(#greenGrad)"/>
    <text x="252" y="136" fill="#e2e8f0" font-size="11" font-weight="700">62%</text>

    <!-- BAT Bar -->
    <text x="16" y="171" fill="#94a3b8" font-size="11" font-weight="600">BAT</text>
    <rect x="60" y="160" width="180" height="14" rx="3" fill="#1e293b"/>
    <rect x="60" y="160" width="171" height="14" rx="3" fill="url(#greenGrad)"/>
    <text x="252" y="171" fill="#e2e8f0" font-size="11" font-weight="700">95%</text>

    <!-- Specs Summary Grid -->
    <rect x="16" y="192" width="278" height="52" rx="6" fill="#080c14" stroke="#1e293b"/>
    <text x="28" y="212" fill="#64748b" font-size="10" font-weight="600">RAM: <tspan fill="#cbd5e1">7.7/16 GB</tspan></text>
    <text x="155" y="212" fill="#64748b" font-size="10" font-weight="600">CORES: <tspan fill="#cbd5e1">8 Cores</tspan></text>
    <text x="28" y="232" fill="#64748b" font-size="10" font-weight="600">DISK: <tspan fill="#cbd5e1">280/450 GB</tspan></text>
    <text x="155" y="232" fill="#64748b" font-size="10" font-weight="600">DAEMONS: <tspan fill="#38ef7d">3 Active</tspan></text>

    <!-- Objectives / Pending Tasks -->
    <rect x="0" y="275" width="310" height="280" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
    <text x="16" y="303" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">ACTIVE OBJECTIVES</text>
    <line x1="16" y1="313" x2="294" y2="313" stroke="#1e293b" stroke-width="1"/>

    <!-- Task Item 1 -->
    <rect x="16" y="325" width="278" height="42" rx="6" fill="#1e293b" fill-opacity="0.6"/>
    <circle cx="32" cy="346" r="6" stroke="#00f2fe" stroke-width="2" fill="none"/>
    <text x="48" y="342" fill="#f1f5f9" font-size="11" font-weight="600">Review project architecture spec</text>
    <text x="48" y="356" fill="#f59e0b" font-size="9" font-weight="500">TODAY • HIGH PRIORITY</text>

    <!-- Task Item 2 -->
    <rect x="16" y="375" width="278" height="42" rx="6" fill="#1e293b" fill-opacity="0.6"/>
    <circle cx="32" cy="396" r="6" stroke="#38ef7d" stroke-width="2" fill="none"/>
    <text x="48" y="392" fill="#f1f5f9" font-size="11" font-weight="600">Sync calendar ICS data</text>
    <text x="48" y="406" fill="#10b981" font-size="9" font-weight="500">TOMORROW • MEDIUM</text>

    <!-- Task Item 3 -->
    <rect x="16" y="425" width="278" height="42" rx="6" fill="#1e293b" fill-opacity="0.6"/>
    <circle cx="32" cy="446" r="6" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <text x="48" y="442" fill="#94a3b8" font-size="11" font-weight="500">Run security audit sweep</text>
    <text x="48" y="456" fill="#64748b" font-size="9" font-weight="500">BACKLOG</text>

    <!-- Add Task Hint -->
    <text x="155" y="525" fill="#64748b" font-size="10" font-weight="500" text-anchor="middle">+ Type 'add todo' to insert task</text>
  </g>

  <!-- CENTER COLUMN: Arc Reactor Visual & Command Interface -->
  <g transform="translate(385, 80)">
    <rect x="0" y="0" width="430" height="555" rx="8" fill="#0b101d" stroke="#1e293b"/>

    <!-- Status Banner -->
    <rect x="115" y="18" width="200" height="28" rx="14" fill="#07090e" stroke="#00f2fe" stroke-opacity="0.3"/>
    <circle cx="132" cy="32" r="5" fill="#00f2fe" filter="url(#glow)"/>
    <text x="220" y="36" fill="#00f2fe" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">DETERMINISTIC ROUTER (TIER 1)</text>

    <!-- Central Arc Reactor Visualization -->
    <g transform="translate(215, 200)">
      <!-- Outer Pulsing Ring -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#00f2fe" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="12 8"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#4facfe" stroke-opacity="0.3" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="75" fill="none" stroke="#00f2fe" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="40 10 15 10" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="50" fill="#00f2fe" fill-opacity="0.05" stroke="#38ef7d" stroke-width="2"/>
      <circle cx="0" cy="0" r="22" fill="url(#cyanGrad)" opacity="0.9" filter="url(#glow)"/>

      <!-- Orbiting Node Dots -->
      <circle cx="-75" cy="0" r="4" fill="#00f2fe"/>
      <circle cx="75" cy="0" r="4" fill="#00f2fe"/>
      <circle cx="0" cy="-75" r="4" fill="#38ef7d"/>
      <circle cx="0" cy="75" r="4" fill="#ff0844"/>

      <!-- Status Subtext -->
      <text x="0" y="125" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">PIKINA REASONING CORE</text>
      <text x="0" y="145" fill="#64748b" font-size="11" font-weight="500" text-anchor="middle">Zero Cloud Latency • Sub-Millisecond Win32 Routing</text>
    </g>

    <!-- Command Console Bar -->
    <g transform="translate(20, 395)">
      <rect x="0" y="0" width="390" height="52" rx="8" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" filter="url(#glow)"/>
      <text x="18" y="32" fill="#00f2fe" font-size="18" font-weight="700">›_</text>
      <text x="48" y="31" fill="#f8fafc" font-size="13" font-weight="600" letter-spacing="0.5">open vs code</text>
      <text x="152" y="31" fill="#00f2fe" font-size="14" font-weight="400">|</text>

      <rect x="290" y="10" width="90" height="32" rx="6" fill="url(#cyanGrad)"/>
      <text x="335" y="30" fill="#07090e" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">EXECUTE</text>
    </g>

    <!-- Autocomplete / Direct Intent Feedback -->
    <g transform="translate(20, 460)">
      <rect x="0" y="0" width="390" height="75" rx="6" fill="#080c14" stroke="#1e293b"/>
      <text x="15" y="22" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1">INTENT ROUTER MATCH</text>

      <rect x="15" y="32" width="65" height="18" rx="3" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
      <text x="47.5" y="44" fill="#38ef7d" font-size="9" font-weight="700" text-anchor="middle">MATCHED</text>

      <text x="90" y="44" fill="#cbd5e1" font-size="11" font-weight="600">Tool: <tspan fill="#00f2fe">app.open</tspan> | Target: <tspan fill="#f1f5f9">Code.exe</tspan></text>
      <text x="15" y="64" fill="#64748b" font-size="10" font-weight="500">Latency: 0.42 ms • Safety Level: L1 (Auto-Permitted)</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Event Stream & Memory Graph -->
  <g transform="translate(840, 80)">
    <!-- Event Replay Stream -->
    <rect x="0" y="0" width="310" height="260" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
    <text x="16" y="28" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">EVENT REPLAY STREAM</text>
    <line x1="16" y1="38" x2="294" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Event 1 -->
    <text x="16" y="58" fill="#64748b" font-size="10" font-weight="600">13:13:58</text>
    <text x="70" y="58" fill="#38ef7d" font-size="10" font-weight="700">daemon.clipboard</text>
    <text x="16" y="72" fill="#cbd5e1" font-size="10" font-weight="400">Captured text snippet (48 chars)</text>

    <!-- Event 2 -->
    <text x="16" y="98" fill="#64748b" font-size="10" font-weight="600">13:12:40</text>
    <text x="70" y="98" fill="#00f2fe" font-size="10" font-weight="700">daemon.file_watcher</text>
    <text x="16" y="112" fill="#cbd5e1" font-size="10" font-weight="400">MODIFIED README.md in workspace</text>

    <!-- Event 3 -->
    <text x="16" y="138" fill="#64748b" font-size="10" font-weight="600">13:10:12</text>
    <text x="70" y="138" fill="#f59e0b" font-size="10" font-weight="700">memory.promoted</text>
    <text x="16" y="152" fill="#cbd5e1" font-size="10" font-weight="400">Promoted project path to Permanent Store</text>

    <!-- Event 4 -->
    <text x="16" y="178" fill="#64748b" font-size="10" font-weight="600">13:05:00</text>
    <text x="70" y="178" fill="#a855f7" font-size="10" font-weight="700">calendar.sync</text>
    <text x="16" y="192" fill="#cbd5e1" font-size="10" font-weight="400">Synced 4 upcoming team events</text>

    <!-- Stream Footer -->
    <rect x="16" y="215" width="278" height="28" rx="4" fill="#080c14" stroke="#1e293b"/>
    <text x="155" y="233" fill="#64748b" font-size="10" font-weight="600" text-anchor="middle">Audit Log: <tspan fill="#38bdf8">replay_store.sqlite</tspan></text>

    <!-- Dual Memory Engine Box -->
    <rect x="0" y="275" width="310" height="280" rx="8" fill="#0f172a" fill-opacity="0.7" stroke="#1e293b"/>
    <text x="16" y="303" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">MEMORY &amp; KNOWLEDGE GRAPH</text>
    <line x1="16" y1="313" x2="294" y2="313" stroke="#1e293b" stroke-width="1"/>

    <!-- Graph Schema Graphic inside box -->
    <g transform="translate(155, 395)">
      <!-- Links -->
      <line x1="-70" y1="-30" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="70" y1="-30" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="-50" y1="40" x2="0" y2="0" stroke="#38ef7d" stroke-width="1.5"/>
      <line x1="50" y1="40" x2="0" y2="0" stroke="#a855f7" stroke-width="1.5"/>

      <!-- Center Node -->
      <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#00f2fe" stroke-width="2"/>
      <text x="0" y="4" fill="#00f2fe" font-size="9" font-weight="800" text-anchor="middle">USER</text>

      <!-- Node 1 -->
      <circle cx="-70" cy="-30" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="-70" y="-27" fill="#cbd5e1" font-size="8" font-weight="700" text-anchor="middle">Files</text>

      <!-- Node 2 -->
      <circle cx="70" cy="-30" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="70" y="-27" fill="#cbd5e1" font-size="8" font-weight="700" text-anchor="middle">Prefs</text>

      <!-- Node 3 -->
      <circle cx="-50" cy="40" r="16" fill="#0f172a" stroke="#38ef7d" stroke-width="1.5"/>
      <text x="-50" y="43" fill="#cbd5e1" font-size="8" font-weight="700" text-anchor="middle">Tasks</text>

      <!-- Node 4 -->
      <circle cx="50" cy="40" r="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <text x="50" y="43" fill="#cbd5e1" font-size="8" font-weight="700" text-anchor="middle">Events</text>
    </g>

    <text x="155" y="495" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">Vector Store: <tspan fill="#38ef7d">All-MiniLM-L6-v2</tspan></text>
    <text x="155" y="515" fill="#64748b" font-size="10" font-weight="500" text-anchor="middle">Auto-decay ephemeral &amp; permanent promotion</text>
  </g>
</svg>
